name: Report a bug
description: Report a problem with Asylum.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Please [search the existing issues](https://github.com/viniengelage/asylum/issues) first.
        If the problem also happens in Zed itself, report it to [Zed](https://github.com/zed-industries/zed/issues) instead.
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Step by step, starting from a clean Asylum install.
      placeholder: |
        1. Open Asylum
        2. Click X
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current vs. expected behavior
      description: Screenshots and videos help.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Asylum version and system specs
      description: Run "copy system specs into clipboard" from the command palette and paste the result here.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant log lines
      description: |
        Open the log with "open log" from the command palette. On macOS it is also at `~/Library/Logs/Asylum/Asylum.log`.
      render: shell
