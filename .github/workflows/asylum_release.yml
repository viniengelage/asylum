# Builds Asylum for macOS (Apple Silicon) and Windows (x64) on GitHub-hosted runners.
#
# - Every push to `main` builds both and publishes a GitHub Release tagged `asylum-v<version>`;
#   pushing a tag `asylum-v<version>` does the same under that tag.
# - The version is Asylum's own, separate from Zed's (which stays in `crates/zed/Cargo.toml`
#   because extensions check compatibility against it). `ASYLUM_VERSION` at the repository root
#   holds the `MAJOR.MINOR` series; each release takes the next patch after the series' latest
#   tag, so bumping the series is the only manual step.
# - Run it by hand (Actions → asylum_release → Run workflow) to only build and keep the
#   installers as workflow artifacts.
#
# Each release carries `asylum-release.json`, which the app's auto-updater reads from
# `releases/latest/download/` to find the installer for its platform (see
# `crates/auto_update`). A release is the latest one only if it isn't a prerelease or draft.
#
# Hand-written, not generated by `cargo xtask workflows`: the generated ones target Zed's own
# infrastructure (Namespace runners, Zed's signing secrets) and are skipped in this fork. The tag
# prefix is not `v*` so Zed's `release.yml` never picks these tags up.
name: asylum_release

on:
  push:
    branches:
      - main
    tags:
      - asylum-v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asylum-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Hosted runners have few cores; a single codegen unit per crate would make the release
  # build several times slower for a barely smaller binary.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  # The license check fails on any cargo-about warning, which new fork dependencies can
  # trigger without anything being wrong with the build.
  ALLOW_MISSING_LICENSES: 1
  # Compiled into the auto-updater, so a build checks the releases of the repository it was
  # built from.
  ASYLUM_RELEASES_REPO: ${{ github.repository }}

jobs:
  version:
    name: Assign the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the next version in the series
        id: version
        run: |
          series=$(tr -d '[:space:]' < ASYLUM_VERSION)
          if [[ ! "$series" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "ASYLUM_VERSION must hold MAJOR.MINOR, found '$series'" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#asylum-v}"
          else
            # Only `asylum-v<series>.<patch>` tags count; the tags from before Asylum had its
            # own version (`asylum-v<zed version>-<run>`) don't match.
            escaped_series="${series//./\\.}"
            last_patch=$(
              git ls-remote --tags --refs origin "refs/tags/asylum-v${series}.*" \
                | sed -nE "s#.*refs/tags/asylum-v${escaped_series}\.([0-9]+)\$#\1#p" \
                | sort -n \
                | tail -n 1
            )
            if [[ -z "$last_patch" ]]; then
              version="${series}.0"
            else
              version="${series}.$((last_patch + 1))"
            fi
          fi

          echo "Asylum $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=asylum-v$version" >> "$GITHUB_OUTPUT"

  bundle_mac:
    name: macOS (aarch64)
    needs: version
    runs-on: macos-15
    timeout-minutes: 360
    env:
      # Compiled into the app as the version it shows (see `release_channel::ASYLUM_VERSION`).
      ASYLUM_VERSION: ${{ needs.version.outputs.version }}
      # No debug info: the standard macOS runner has little disk and 7 GB of RAM, and nothing
      # uploads the symbols anyway.
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet ~/hostedtoolcache/CodeQL || true
          xcrun simctl delete all || true
          df -h /

      - uses: actions/checkout@v4

      # The runner's default Xcode is older than the one the SimulatorKit bridge is written
      # against (its private Swift symbols change between releases), so the newest installed
      # Xcode is selected instead. Betas and release candidates are skipped: a release built
      # against one could depend on symbols that the final Xcode changes.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          newest_xcode="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)"
          if [ -z "$newest_xcode" ]; then
            echo "No stable Xcode found on the runner" >&2
            exit 1
          fi
          sudo xcode-select -s "$newest_xcode"
          xcodebuild -version

      - name: Ensure the Metal compiler is available
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          # The release target directory is far bigger than the cache quota; only the
          # registry and the installed cargo tools (cargo-bundle, cargo-about) are kept.
          cache-targets: false
          shared-key: asylum-mac

      # Signing with the same certificate on every release is what keeps keychain items and
      # privacy permissions across updates. MACOS_CERTIFICATE is a base64 .p12, self-signed
      # or Developer ID; the notarization secrets only apply to a Developer ID certificate.
      # Without any of them the app is signed ad-hoc.
      - name: Build the app bundle and DMG
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
        run: script/bundle-mac

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: Asylum-aarch64.dmg
          path: target/aarch64-apple-darwin/release/Asylum-aarch64.dmg
          if-no-files-found: error

  bundle_windows:
    name: Windows (x86_64)
    needs: version
    # windows-2025 does not ship Inno Setup; 2022 does.
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      ASYLUM_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: asylum-windows

      - name: Fetch dependencies
        # bundle-windows.ps1 reads the workspace version with `cargo metadata --offline`.
        run: cargo fetch

      - name: Build the installer
        shell: pwsh
        run: ./script/bundle-windows.ps1 -Architecture x86_64

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Asylum-x86_64.exe
          path: target/Asylum-x86_64.exe
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release
    # The macOS build is the one the auto-updater depends on; a failed Windows build only
    # leaves its installer out of the release.
    if: github.event_name == 'push' && !cancelled() && needs.bundle_mac.result == 'success'
    needs: [version, bundle_mac, bundle_windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog walks the commits since the previous release's tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the release manifest
        id: manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          zed_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/zed/Cargo.toml | head -n 1)

          assets='{"macos-aarch64": "Asylum-aarch64.dmg"}'
          if [[ -f artifacts/Asylum-x86_64.exe ]]; then
            assets=$(jq -c '. + {"windows-x86_64": "Asylum-x86_64.exe"}' <<<"$assets")
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg zed_version "$zed_version" \
            --arg tag "$TAG" \
            --arg commit "$GITHUB_SHA" \
            --argjson commit_timestamp "$(git show -s --format=%ct HEAD)" \
            --argjson assets "$assets" \
            '{version: $version, zed_version: $zed_version, tag: $tag, commit: $commit, commit_timestamp: $commit_timestamp, assets: $assets}' \
            > artifacts/asylum-release.json
          cat artifacts/asylum-release.json
          echo "zed_version=$zed_version" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          ZED_VERSION: ${{ steps.manifest.outputs.zed_version }}
        run: |
          {
            echo "## O que mudou"
            echo
            script/asylum-changelog
            echo
            echo "---"
            echo
            cat <<EOF
          Built from ${GITHUB_SHA}, based on Zed ${ZED_VERSION}.
          Installed copies of Asylum update to this release by themselves.

          Builds are not notarized.

          **macOS:** open the DMG, drag Asylum to Applications, then clear the quarantine flag
          once so Gatekeeper lets it start:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/Asylum.app
          \`\`\`

          **Windows:** run the installer; on the SmartScreen prompt choose
          "More info" → "Run anyway".
          EOF
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Asylum ${{ needs.version.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            artifacts/asylum-release.json
            artifacts/Asylum-aarch64.dmg
            artifacts/Asylum-x86_64.exe
          body_path: release-notes.md
