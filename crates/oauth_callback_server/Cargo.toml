[package]
name = "oauth_callback_server"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Loopback OAuth 2.0 callback server and the HTML page shown in the browser after authorizing"

[lints]
workspace = true

[lib]
path = "src/oauth_callback_server.rs"
doctest = false
test = false

[dependencies]
anyhow.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
futures.workspace = true
i18n.workspace = true
log = { workspace = true, features = ["serde"] }
tiny_http.workspace = true
url.workspace = true
